# Series site proxy: one nginx in front of the three book containers.
# Mounted at /etc/nginx/conf.d/default.conf by the "proxy" service in
# series-docker-compose.yml; the landing page (series/index.html) is served
# by this same container from /usr/share/nginx/html.
#
#   /          -> landing page (this container)
#   /tech/     -> Technician book  (compose service "tech")     — active
#   /general/  -> General book     (compose service "general")  — active
#   /extra/    -> Extra book       (compose service "extra")    — active
#
# Each book image is nginx:alpine and listens on container port 80 (the
# standalone docker-compose.yml merely publishes it to the host as 8080),
# so upstreams are http://<service>:80/. proxy_pass carries a URI part
# ("/") so the book container's site root maps onto the sub-path, e.g.
# /tech/audiobook/ -> http://tech:80/audiobook/. The books emit only
# relative/anchor links (enforced by test_build_book.py), so no response
# rewriting is needed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Landing page: only this exact path is served by the proxy itself.
    location = / {
        try_files /index.html =404;
    }

    # Convenience: /tech -> /tech/, /general -> /general/, /extra -> /extra/
    # so the books' relative links resolve under the sub-path.
    location = /tech { return 301 /tech/; }
    location = /general { return 301 /general/; }
    location = /extra { return 301 /extra/; }

    # --- Technician (active) ---------------------------------------------
    location /tech/ {
        proxy_pass http://tech:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /tech;
    }

    # --- General (active — this book) --------------------------------------
    location /general/ {
        proxy_pass http://general:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /general;
    }

    # --- Extra (active) -----------------------------------------------------
    location /extra/ {
        proxy_pass http://extra:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /extra;
    }
}
