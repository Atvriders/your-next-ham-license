# Series site: all three "Your First Ham License" books behind one nginx
# proxy, plus the landing page. All three books are runnable:
#
#   docker compose -f series-docker-compose.yml up -d
#
# No host files needed — the compose file is fully self-contained (safe to
# paste into the Portainer web editor or run from any checkout): the proxy
# is a prebuilt image with the nginx config and landing page baked in, so
# nothing is bind-mounted from the host.
#
# Browse http://localhost:8080/         -> landing page (baked into the proxy image)
#        http://localhost:8080/tech/    -> the Technician book + audiobook
#        http://localhost:8080/general/ -> the General book + audiobook
#        http://localhost:8080/extra/   -> the Extra book + audiobook
#
# The proxy image (ghcr.io/atvriders/series-proxy) is built and pushed by
# the your-first-ham-license repo's CI from its series/ directory (the
# source of truth); the series/ files here are mirror copies.
#
# Ports:
#   proxy                  -> host :8080 (the only published port)
#   tech / general / extra -> container :80, internal only (the book images
#                             are nginx:alpine listening on 80; not
#                             host-published)

services:
  tech:
    image: ghcr.io/atvriders/your-first-ham-license:latest
    restart: unless-stopped

  general:
    image: ghcr.io/atvriders/your-next-ham-license:latest
    restart: unless-stopped

  extra:
    image: ghcr.io/atvriders/your-last-ham-license:latest
    restart: unless-stopped

  proxy:
    image: ghcr.io/atvriders/series-proxy:latest
    ports:
      - "8080:80"
    depends_on:
      - tech
      - general
      - extra
    restart: unless-stopped
