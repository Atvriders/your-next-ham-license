<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== Title ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="400" y="32" font-size="18" font-weight="bold">THE IMPEDANCE PLANE: Z = R + jX</text>
    <text x="400" y="53" font-size="12">resistance along the axis — reactance above (inductive) or below (capacitive)</text>
  </g>

  <!-- ===== Worked-example box (top right; pool G5B06 50-ohm family) ===== -->
  <rect x="470" y="74" width="320" height="130" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <g fill="currentColor" stroke="none">
    <text x="486" y="100" font-size="11.5" font-weight="bold">WORKED EXAMPLE</text>
    <text x="486" y="124" font-size="11.5">Z = R + jX = 50 + j50 Ω</text>
    <text x="486" y="146" font-size="11.5">|Z| = √(R² + X²) = √(50² + 50²)</text>
    <text x="486" y="166" font-size="11.5">≈ 70.7 Ω · φ = arctan(X / R) = 45°</text>
    <text x="486" y="190" font-size="9.5" font-style="italic">the magnitude is always a plain positive ohms value</text>
  </g>

  <!-- ===== Axes (R >= 0 always, so the R axis starts at the origin) ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round">
    <line x1="150" y1="300" x2="656" y2="300"/>
    <line x1="150" y1="516" x2="150" y2="84"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="656,300 644,295 644,305"/>
    <polygon points="150,84 145,96 155,96"/>
    <polygon points="150,516 145,504 155,504"/>
  </g>

  <!-- axis titles -->
  <text x="656" y="284" font-size="11" fill="currentColor" stroke="none" text-anchor="end">resistance R (Ω)</text>
  <text x="126" y="180" font-size="11" fill="currentColor" stroke="none" text-anchor="middle" transform="rotate(-90 126 180)">+jX · inductive — V leads I</text>
  <text x="126" y="420" font-size="11" fill="currentColor" stroke="none" text-anchor="middle" transform="rotate(-90 126 420)">−jX · capacitive — V lags I</text>

  <!-- tick marks + labels: 1 ohm = 4 px, ticks every 10, labels every 20 -->
  <g stroke="currentColor" fill="none" stroke-width="1">
    <line x1="190" y1="296" x2="190" y2="304"/><line x1="230" y1="296" x2="230" y2="304"/>
    <line x1="270" y1="296" x2="270" y2="304"/><line x1="310" y1="296" x2="310" y2="304"/>
    <line x1="350" y1="296" x2="350" y2="304"/><line x1="390" y1="296" x2="390" y2="304"/>
    <line x1="430" y1="296" x2="430" y2="304"/><line x1="470" y1="296" x2="470" y2="304"/>
    <line x1="510" y1="296" x2="510" y2="304"/><line x1="550" y1="296" x2="550" y2="304"/>
    <line x1="590" y1="296" x2="590" y2="304"/><line x1="630" y1="296" x2="630" y2="304"/>
    <line x1="146" y1="100" x2="154" y2="100"/><line x1="146" y1="140" x2="154" y2="140"/>
    <line x1="146" y1="180" x2="154" y2="180"/><line x1="146" y1="220" x2="154" y2="220"/>
    <line x1="146" y1="260" x2="154" y2="260"/>
    <line x1="146" y1="340" x2="154" y2="340"/><line x1="146" y1="380" x2="154" y2="380"/>
    <line x1="146" y1="420" x2="154" y2="420"/><line x1="146" y1="460" x2="154" y2="460"/>
    <line x1="146" y1="500" x2="154" y2="500"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="9">
    <text x="230" y="318" text-anchor="middle">20</text>
    <text x="310" y="318" text-anchor="middle">40</text>
    <text x="390" y="318" text-anchor="middle">60</text>
    <text x="470" y="318" text-anchor="middle">80</text>
    <text x="550" y="318" text-anchor="middle">100</text>
    <text x="160" y="223">20</text>
    <text x="160" y="143">40</text>
    <text x="160" y="383">−20</text>
    <text x="160" y="463">−40</text>
  </g>

  <!-- ===== Main vector: Z = 50 + j50 (1 ohm = 4 px) ===== -->
  <line x1="150" y1="300" x2="350" y2="100" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round"/>
  <polygon points="350,100 343.6,113.4 336.6,106.4" fill="currentColor" stroke="none"/>
  <circle cx="350" cy="100" r="4" fill="currentColor" stroke="none"/>
  <text x="360" y="94" font-size="11" font-weight="bold" fill="currentColor" stroke="none">Z = 50 + j50</text>
  <text x="235" y="148" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none" text-anchor="middle">|Z| ≈ 70.7 Ω</text>

  <!-- construction: R component along the axis, X component vertical -->
  <g stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="150" y1="294" x2="350" y2="294"/>
    <line x1="356" y1="100" x2="356" y2="300"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2">
    <line x1="150" y1="290" x2="150" y2="298"/><line x1="350" y1="290" x2="350" y2="298"/>
    <line x1="352" y1="100" x2="360" y2="100"/><line x1="352" y1="300" x2="360" y2="300"/>
  </g>
  <text x="250" y="288" font-size="11" fill="currentColor" stroke="none" text-anchor="middle">R = 50 Ω</text>
  <text x="368" y="204" font-size="11" fill="currentColor" stroke="none">X = +50 Ω</text>

  <!-- phase angle arc: phi = arctan(50/50) = 45 deg -->
  <path d="M 210 300 A 60 60 0 0 0 192.43 257.57" stroke="currentColor" fill="none" stroke-width="1.5"/>
  <text x="234" y="272" font-size="11" fill="currentColor" stroke="none">φ = 45°</text>

  <!-- ===== Mirror vector: Z = 50 - j50 (capacitive) ===== -->
  <line x1="150" y1="300" x2="350" y2="500" stroke="currentColor" fill="none" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <polygon points="350,500 343.6,486.6 336.6,493.6" fill="currentColor" stroke="none"/>
  <circle cx="350" cy="500" r="4" fill="currentColor" stroke="none"/>
  <text x="360" y="506" font-size="11" fill="currentColor" stroke="none">Z = 50 − j50</text>
  <line x1="356" y1="300" x2="356" y2="500" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g stroke="currentColor" fill="none" stroke-width="1.2">
    <line x1="352" y1="500" x2="360" y2="500"/>
  </g>
  <text x="368" y="404" font-size="11" fill="currentColor" stroke="none">X = −50 Ω</text>
  <path d="M 195 300 A 45 45 0 0 1 181.82 331.82" stroke="currentColor" fill="none" stroke-width="1.5"/>
  <text x="212" y="342" font-size="10" fill="currentColor" stroke="none">−45°</text>
  <text x="250" y="472" font-size="10.5" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">|Z| ≈ 70.7 Ω · φ = −45°</text>

  <!-- ===== bottom note ===== -->
  <text x="400" y="548" font-size="11.5" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">R and X add as vectors — 50 Ω of R plus 50 Ω of X is 70.7 Ω of Z, not 100 Ω</text>

</svg>
