<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="sans-serif">

  <!-- ===== F layer (dashed) ===== -->
  <g fill="none" stroke="currentColor" stroke-width="1.6">
    <line x1="40" y1="70" x2="720" y2="70" stroke-dasharray="8,5"/>
    <line x1="40" y1="96" x2="720" y2="96" stroke-dasharray="8,5"/>
  </g>

  <!-- ===== Ground with hatching ===== -->
  <line x1="40" y1="360" x2="750" y2="360" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.7" fill="none">
    <line x1="60" y1="360" x2="51" y2="371"/>
    <line x1="100" y1="360" x2="91" y2="371"/>
    <line x1="140" y1="360" x2="131" y2="371"/>
    <line x1="180" y1="360" x2="171" y2="371"/>
    <line x1="220" y1="360" x2="211" y2="371"/>
    <line x1="260" y1="360" x2="251" y2="371"/>
    <line x1="300" y1="360" x2="291" y2="371"/>
    <line x1="340" y1="360" x2="331" y2="371"/>
    <line x1="420" y1="360" x2="411" y2="371"/>
    <line x1="460" y1="360" x2="451" y2="371"/>
    <line x1="500" y1="360" x2="491" y2="371"/>
    <line x1="540" y1="360" x2="531" y2="371"/>
    <line x1="580" y1="360" x2="571" y2="371"/>
    <line x1="620" y1="360" x2="611" y2="371"/>
    <line x1="660" y1="360" x2="651" y2="371"/>
    <line x1="700" y1="360" x2="691" y2="371"/>
    <line x1="740" y1="360" x2="731" y2="371"/>
  </g>

  <!-- ===== Distance scale (1 px = 1 mile) ===== -->
  <g fill="none" stroke="currentColor" stroke-width="1.4">
    <line x1="80" y1="360" x2="80" y2="368"/>
    <line x1="230" y1="360" x2="230" y2="368"/>
    <line x1="380" y1="360" x2="380" y2="368"/>
    <line x1="530" y1="360" x2="530" y2="368"/>
    <line x1="680" y1="360" x2="680" y2="368"/>
  </g>

  <!-- ===== TX tower ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="380" y1="360" x2="380" y2="276"/>
    <line x1="380" y1="276" x2="368" y2="264"/>
    <line x1="380" y1="276" x2="380" y2="256"/>
    <line x1="380" y1="276" x2="392" y2="264"/>
  </g>

  <!-- ===== NVIS rays: steep launch, all return close in ===== -->
  <!-- Vertical ray: straight up, straight back down -->
  <path d="M 374,274 L 372,108 Q 372,78 380,78 Q 388,78 388,108 L 388,358" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <path d="M 372,176 L 366.5,186.5 L 377.5,186.5 Z" fill="currentColor" stroke="none"/>
  <path d="M 388,206 L 382.5,195.5 L 393.5,195.5 Z" fill="currentColor" stroke="none"/>

  <!-- Steep rays, left and right -->
  <path d="M 376,276 L 326,102 Q 312,70 298,102 L 264,356" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <path d="M 276,258 L 272.5,244.3 L 283.3,245.9 Z" fill="currentColor" stroke="none"/>
  <circle cx="262" cy="360" r="3" fill="currentColor" stroke="none"/>

  <path d="M 384,276 L 434,102 Q 448,70 462,102 L 496,356" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <path d="M 484,258 L 476.7,245.9 L 487.5,244.3 Z" fill="currentColor" stroke="none"/>
  <circle cx="498" cy="360" r="3" fill="currentColor" stroke="none"/>

  <path d="M 374,276 L 268,100 Q 248,66 228,100 L 164,356" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <path d="M 188,262 L 186,248 L 196.6,250.8 Z" fill="currentColor" stroke="none"/>
  <circle cx="162" cy="360" r="3" fill="currentColor" stroke="none"/>

  <path d="M 386,276 L 490,100 Q 510,66 530,100 L 593,356" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <path d="M 570,262 L 561.4,250.8 L 572.1,248 Z" fill="currentColor" stroke="none"/>
  <circle cx="595" cy="360" r="3" fill="currentColor" stroke="none"/>

  <!-- ===== Contrast: low-angle DX ray skips the whole region ===== -->
  <path d="M 392,278 L 590,102 Q 625,72 660,102 L 748,330" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="7,4" opacity="0.85"/>
  <path d="M 748,330 L 738.2,319.9 L 748.4,315.9 Z" fill="currentColor" stroke="none"/>

  <!-- leader: "near-vertical launch" label to the straight-up ray -->
  <line x1="383" y1="58" x2="381" y2="74" fill="none" stroke="currentColor" stroke-width="1"/>

  <!-- ===== Coverage bracket ===== -->
  <g fill="none" stroke="currentColor" stroke-width="1.6">
    <line x1="162" y1="388" x2="162" y2="404"/>
    <line x1="595" y1="388" x2="595" y2="404"/>
    <line x1="162" y1="396" x2="595" y2="396"/>
  </g>

  <!-- ===== Labels ===== -->
  <g fill="currentColor" stroke="none">
    <text x="255" y="52" text-anchor="middle" font-size="12" letter-spacing="2">F LAYER</text>
    <text x="48" y="32" font-size="11">below the critical frequency -</text>
    <text x="48" y="45" font-size="11">even straight-up comes back</text>
    <text x="48" y="58" font-size="10.5">typical: 40 m day, 80 m night</text>
    <text x="712" y="42" text-anchor="end" font-size="11">regional + emcomm nets:</text>
    <text x="712" y="56" text-anchor="end" font-size="11">everyone in range hears you</text>

    <text x="362" y="296" text-anchor="end" font-size="12" font-weight="bold">TX</text>
    <text x="400" y="52" text-anchor="middle" font-size="11">near-vertical launch</text>
    <text x="712" y="220" text-anchor="middle" font-size="11" transform="rotate(68.9 712 220)">low-angle DX path</text>
    <text x="740" y="352" text-anchor="end" font-size="10">lands far out</text>

    <text x="80" y="382" text-anchor="middle" font-size="10.5">300 mi</text>
    <text x="230" y="382" text-anchor="middle" font-size="10.5">150</text>
    <text x="380" y="382" text-anchor="middle" font-size="10.5">0</text>
    <text x="530" y="382" text-anchor="middle" font-size="10.5">150</text>
    <text x="680" y="382" text-anchor="middle" font-size="10.5">300 mi</text>
    <text x="378" y="416" text-anchor="middle" font-size="12.5" font-weight="bold">blanket coverage ~0-300 mi - NO SKIP ZONE</text>
  </g>
</svg>
