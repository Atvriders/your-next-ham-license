<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="sans-serif">

  <!-- ================= row 1 (left to right) ================= -->

  <!-- 1: pass Element 3 -->
  <text x="30" y="40" font-size="12" font-weight="bold" fill="currentColor">1</text>
  <rect x="24" y="48" width="232" height="78" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.06"/>
  <text x="140" y="78" font-size="13.5" font-weight="bold" fill="currentColor" text-anchor="middle">PASS ELEMENT 3</text>
  <text x="140" y="97" font-size="10" fill="currentColor" text-anchor="middle">35 questions, 26 correct to pass</text>
  <text x="140" y="112" font-size="10" fill="currentColor" text-anchor="middle">Element 2 already credited</text>

  <!-- arrow 1 -> 2 -->
  <line x1="260" y1="87" x2="272" y2="87" stroke="currentColor" stroke-width="2"/>
  <polygon points="280,87 270,82 270,92" fill="currentColor"/>

  <!-- 2: CSCE + Form 605 -->
  <text x="286" y="40" font-size="12" font-weight="bold" fill="currentColor">2</text>
  <rect x="280" y="48" width="232" height="78" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.06"/>
  <text x="396" y="78" font-size="13.5" font-weight="bold" fill="currentColor" text-anchor="middle">CSCE + FORM 605</text>
  <text x="396" y="97" font-size="10" fill="currentColor" text-anchor="middle">605 properly submitted to the VEs</text>
  <text x="396" y="112" font-size="10" fill="currentColor" text-anchor="middle">+ the CSCE in your hand</text>

  <!-- arrow 2 -> 3 -->
  <line x1="516" y1="87" x2="528" y2="87" stroke="currentColor" stroke-width="2"/>
  <polygon points="536,87 526,82 526,92" fill="currentColor"/>

  <!-- 3: on the air with /AG (highlighted) -->
  <text x="542" y="40" font-size="12" font-weight="bold" fill="currentColor">3</text>
  <rect x="536" y="48" width="232" height="78" stroke="currentColor" stroke-width="3.5" fill="currentColor" fill-opacity="0.12"/>
  <text x="652" y="76" font-size="13.5" font-weight="bold" fill="currentColor" text-anchor="middle">ON THE AIR — SIGN /AG</text>
  <text x="652" y="94" font-size="10" fill="currentColor" text-anchor="middle">General privileges immediately (§97.9(b))</text>
  <text x="652" y="109" font-size="10" fill="currentColor" text-anchor="middle">every transmission: KX9ABC/AG</text>

  <!-- arrow 3 -> 4 (down) -->
  <line x1="652" y1="130" x2="652" y2="192" stroke="currentColor" stroke-width="2"/>
  <polygon points="652,200 647,190 657,190" fill="currentColor"/>

  <!-- ================= row 2 (right to left) ================= -->

  <!-- 4: ULS shows General -->
  <text x="542" y="192" font-size="12" font-weight="bold" fill="currentColor">4</text>
  <rect x="536" y="200" width="232" height="78" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.06"/>
  <text x="652" y="230" font-size="13.5" font-weight="bold" fill="currentColor" text-anchor="middle">ULS SHOWS GENERAL</text>
  <text x="652" y="248" font-size="10" fill="currentColor" text-anchor="middle">the grant lands —</text>
  <text x="652" y="262" font-size="10" fill="currentColor" text-anchor="middle">typically within days</text>

  <!-- arrow 4 -> 5 (leftward) -->
  <line x1="530" y1="239" x2="516" y2="239" stroke="currentColor" stroke-width="2"/>
  <polygon points="508,239 518,234 518,244" fill="currentColor"/>

  <!-- 5: drop the /AG (highlighted) -->
  <text x="286" y="192" font-size="12" font-weight="bold" fill="currentColor">5</text>
  <rect x="280" y="200" width="232" height="78" stroke="currentColor" stroke-width="3.5" fill="currentColor" fill-opacity="0.12"/>
  <text x="396" y="228" font-size="13.5" font-weight="bold" fill="currentColor" text-anchor="middle">DROP THE /AG</text>
  <text x="396" y="246" font-size="10" fill="currentColor" text-anchor="middle">privileges now rest on the license</text>
  <text x="396" y="261" font-size="10" fill="currentColor" text-anchor="middle">itself — you keep your call sign</text>

  <!-- ================= footnotes ================= -->
  <text x="400" y="308" font-size="10" fill="currentColor" text-anchor="middle">Both conditions happen at the exam session — the Form 605 with the VEs and the CSCE in hand — and /AG rides every transmission until ULS catches up (§97.9(b), §97.119).</text>
  <text x="400" y="325" font-size="10" fill="currentColor" text-anchor="middle">Interim authority ends at final disposition of the application or 365 days after passing, whichever comes first. New licenses differ: no grant in ULS, no transmitting.</text>

</svg>
