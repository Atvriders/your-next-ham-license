<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 655" font-family="sans-serif">

  <!-- ===== Titles ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="380" y="32" font-size="17" font-weight="bold">COAX vs LADDER LINE - TWO WAYS TO FEED AN ANTENNA</text>
    <text x="380" y="53" font-size="12.5">construction, characteristic impedance, velocity factor - and why loss climbs with frequency</text>
  </g>

  <!-- ===== Panel headers ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="13.5" font-weight="bold">
    <text x="210" y="90">COAX - UNBALANCED</text>
    <text x="560" y="90">LADDER / OPEN-WIRE - BALANCED</text>
  </g>

  <!-- faint divider between the panels -->
  <line x1="380" y1="72" x2="380" y2="400" stroke="currentColor" stroke-width="1" stroke-dasharray="2,6" opacity="0.45" fill="none"/>

  <!-- ===== Coax cross-section (cut end view) ===== -->
  <g>
    <!-- dielectric body -->
    <circle cx="210" cy="185" r="74" fill="currentColor" opacity="0.13" stroke="none"/>
    <!-- outer jacket -->
    <circle cx="210" cy="185" r="78" fill="none" stroke="currentColor" stroke-width="6"/>
    <!-- braided shield -->
    <circle cx="210" cy="185" r="60" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="3,3.5"/>
    <!-- center conductor -->
    <circle cx="210" cy="185" r="13" fill="currentColor" stroke="none"/>
  </g>

  <!-- coax part labels (left, horizontal leaders) -->
  <g fill="currentColor" stroke="none" font-size="11.5" text-anchor="end">
    <text x="104" y="122">outer jacket</text>
    <text x="104" y="152">braided shield</text>
    <text x="104" y="174">dielectric</text>
    <text x="104" y="196">center conductor</text>
  </g>
  <g stroke="currentColor" stroke-width="1" fill="none">
    <line x1="108" y1="118" x2="168" y2="118"/>
    <line x1="108" y1="148" x2="161" y2="148"/>
    <line x1="108" y1="170" x2="171" y2="170"/>
    <line x1="108" y1="192" x2="197" y2="192"/>
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="170" cy="118" r="2.2"/>
    <circle cx="163" cy="148" r="2.2"/>
    <circle cx="173" cy="170" r="2.2"/>
    <circle cx="199" cy="192" r="2.2"/>
  </g>

  <!-- coax facts -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="210" y="318" font-size="12.5" font-weight="bold">characteristic impedance ~ 50 Ω</text>
    <text x="210" y="336" font-size="11">set by the conductor sizes (geometry) -</text>
    <text x="210" y="351" font-size="11">not by length, not by frequency</text>
    <text x="210" y="371" font-size="11.5">velocity factor ~ 0.66 (solid dielectric)</text>
    <text x="210" y="389" font-size="11.5">loss climbs fast with frequency</text>
  </g>

  <!-- ===== Ladder line (side view) ===== -->
  <!-- spacers first, conductors over them -->
  <g fill="currentColor" opacity="0.22" stroke="currentColor" stroke-width="1.5">
    <rect x="437" y="146" width="6" height="78" rx="2"/>
    <rect x="482" y="146" width="6" height="78" rx="2"/>
    <rect x="527" y="146" width="6" height="78" rx="2"/>
    <rect x="572" y="146" width="6" height="78" rx="2"/>
    <rect x="617" y="146" width="6" height="78" rx="2"/>
    <rect x="631" y="146" width="6" height="78" rx="2"/>
  </g>
  <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none">
    <line x1="430" y1="150" x2="640" y2="150"/>
    <line x1="430" y1="220" x2="640" y2="220"/>
  </g>

  <!-- spacing dimension D -->
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="415" y1="150" x2="415" y2="220"/>
    <polygon points="415,150 411,159 419,159" fill="currentColor" stroke="none"/>
    <polygon points="415,220 411,211 419,211" fill="currentColor" stroke="none"/>
  </g>
  <text x="403" y="189" font-size="12" fill="currentColor" stroke="none" text-anchor="middle">D</text>

  <!-- ladder part labels (right) -->
  <g fill="currentColor" stroke="none" font-size="11.5">
    <text x="652" y="138">two wires,</text>
    <text x="652" y="152">spacing D apart</text>
    <text x="652" y="190">spacers - the</text>
    <text x="652" y="204">dielectric is air</text>
    <text x="652" y="240">wire radius r</text>
  </g>
  <g stroke="currentColor" stroke-width="1" fill="none">
    <line x1="642" y1="146" x2="650" y2="141"/>
    <line x1="638" y1="186" x2="650" y2="190"/>
    <line x1="642" y1="222" x2="650" y2="236"/>
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="640" cy="147" r="2.2"/>
    <circle cx="636" cy="186" r="2.2"/>
    <circle cx="640" cy="221" r="2.2"/>
  </g>

  <!-- ladder facts -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="560" y="318" font-size="12.5" font-weight="bold">characteristic impedance ~ 450 Ω</text>
    <text x="560" y="336" font-size="11">set by spacing D and wire radius r -</text>
    <text x="560" y="351" font-size="11">not by length, not by frequency</text>
    <text x="560" y="371" font-size="11.5">velocity factor ~ 0.9 (dielectric is air)</text>
    <text x="560" y="389" font-size="11.5">loss stays low, even at high SWR</text>
  </g>

  <!-- ===== Loss vs frequency chart ===== -->
  <text x="380" y="432" font-size="13" font-weight="bold" fill="currentColor" stroke="none" text-anchor="middle">LOSS CLIMBS WITH FREQUENCY - LADDER LINE BARELY NOTICES</text>

  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <line x1="130" y1="452" x2="130" y2="560"/>
    <line x1="130" y1="560" x2="706" y2="560"/>
    <polygon points="130,444 126,454 134,454" fill="currentColor" stroke="none"/>
    <polygon points="712,560 702,556 702,564" fill="currentColor" stroke="none"/>
  </g>
  <text x="98" y="506" font-size="11.5" fill="currentColor" stroke="none" text-anchor="middle" transform="rotate(-90 98 506)">loss (dB / 100 ft)</text>
  <text x="415" y="590" font-size="11.5" fill="currentColor" stroke="none" text-anchor="middle">frequency</text>

  <!-- the two loss curves -->
  <path d="M 130,552 Q 340,548 700,458" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <path d="M 130,556 Q 415,554 700,522" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="7,4"/>
  <text x="540" y="474" font-size="12" fill="currentColor" stroke="none" text-anchor="middle">coax</text>
  <text x="330" y="535" font-size="12" fill="currentColor" stroke="none" text-anchor="middle">ladder line</text>

  <!-- ===== Takeaway ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="12">
    <text x="380" y="616">Loss is quoted in dB per 100 feet - and a lossy line loses even more when the SWR on it is high.</text>
    <text x="380" y="634">That is why a multiband doublet fed with ladder line tolerates a mismatch: the line itself barely loses.</text>
  </g>

</svg>
