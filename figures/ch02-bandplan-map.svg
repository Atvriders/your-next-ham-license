<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="sans-serif">

  <!-- ===== title ===== -->
  <text x="360" y="30" text-anchor="middle" font-size="13.5" font-weight="bold" fill="currentColor" stroke="none">where the modes live on 20 meters — a band plan is a zoning map</text>

  <!-- ===== the whole band, 14.000–14.350 ===== -->
  <rect x="60" y="74" width="630" height="38" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="186" y1="74" x2="186" y2="112"/>
    <line x1="240" y1="74" x2="240" y2="112"/>
    <line x1="330" y1="74" x2="330" y2="112"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="123" y="97" font-size="12">CW</text>
    <text x="213" y="97" font-size="10">digital</text>
    <text x="285" y="97" font-size="12">CW</text>
    <text x="510" y="97" font-size="12">SSB phone (USB)</text>
  </g>

  <!-- beacon marker on the main bar -->
  <line x1="240" y1="74" x2="240" y2="64" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <polygon points="240,54 245,60 240,66 235,60" fill="currentColor" stroke="none"/>
  <text x="252" y="62" font-size="10" fill="currentColor" stroke="none">NCDXF beacons · 14.100</text>

  <!-- frequency ticks -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="60" y1="112" x2="60" y2="120"/>
    <line x1="150" y1="112" x2="150" y2="120"/>
    <line x1="240" y1="112" x2="240" y2="120"/>
    <line x1="330" y1="112" x2="330" y2="120"/>
    <line x1="420" y1="112" x2="420" y2="120"/>
    <line x1="510" y1="112" x2="510" y2="120"/>
    <line x1="600" y1="112" x2="600" y2="120"/>
    <line x1="690" y1="112" x2="690" y2="120"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="10.5" text-anchor="middle">
    <text x="60" y="134">14.000</text>
    <text x="150" y="134">14.050</text>
    <text x="240" y="134">14.100</text>
    <text x="330" y="134">14.150</text>
    <text x="420" y="134">14.200</text>
    <text x="510" y="134">14.250</text>
    <text x="600" y="134">14.300</text>
    <text x="690" y="134">14.350</text>
  </g>

  <!-- spot frequencies inside the phone segment -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <line x1="474" y1="112" x2="474" y2="148"/>
    <line x1="575" y1="112" x2="575" y2="148"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="10" text-anchor="middle">
    <text x="474" y="162">SSTV 14.230</text>
    <text x="575" y="162">AM calling 14.286</text>
  </g>

  <!-- ===== zoom: the digital neighborhood, 14.060–14.150 ===== -->
  <g stroke="currentColor" stroke-width="1" fill="none">
    <line x1="168" y1="166" x2="90" y2="214"/>
    <line x1="330" y1="166" x2="650" y2="214"/>
  </g>
  <text x="360" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="currentColor" stroke="none">the digital neighborhood, stretched — 14.060 to 14.150 MHz</text>

  <rect x="90" y="224" width="560" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <g stroke="currentColor" stroke-width="1.8" fill="none">
    <line x1="152" y1="224" x2="152" y2="258"/>
    <line x1="308" y1="224" x2="308" y2="258"/>
    <line x1="336" y1="224" x2="336" y2="258"/>
    <line x1="342" y1="224" x2="342" y2="258"/>
    <line x1="414" y1="224" x2="414" y2="258"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="10" text-anchor="middle">
    <text x="121" y="246">CW</text>
    <text x="230" y="246">RTTY</text>
    <text x="378" y="246">packet</text>
    <text x="532" y="246">CW</text>
  </g>

  <!-- beacon slot in the zoom (14.0995–14.1005) -->
  <line x1="339" y1="224" x2="339" y2="212" stroke="currentColor" stroke-width="1.2" fill="none"/>
  <text x="347" y="216" font-size="9.5" fill="currentColor" stroke="none">beacons 14.100</text>

  <!-- spot labels below the zoom strip -->
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="152" y1="258" x2="110" y2="274"/>
    <line x1="177" y1="258" x2="200" y2="274"/>
    <line x1="322" y1="258" x2="310" y2="274"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="10" text-anchor="middle">
    <text x="110" y="288">PSK31 14.070</text>
    <text x="200" y="288">FT8 14.074 (USB)</text>
    <text x="310" y="288">packet 14.095–14.0995</text>
  </g>

  <!-- ===== the sideband conventions ===== -->
  <rect x="60" y="336" width="600" height="110" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
  <g fill="currentColor" stroke="none">
    <text x="360" y="358" text-anchor="middle" font-size="12" font-weight="bold">the sideband conventions — custom, not law or physics</text>
    <text x="360" y="380" text-anchor="middle" font-size="11">voice: LSB below 10 MHz (160 / 75 / 40 m) · USB at 10 MHz and above — so 20 m phone is USB</text>
    <text x="360" y="400" text-anchor="middle" font-size="11">digital: AFSK RTTY → LSB · FT8 / FT4 / JT65 / JT9 → USB on EVERY band, 80 m and 40 m included</text>
    <text x="360" y="420" text-anchor="middle" font-size="11">60 m phone is USB-only — the one band where the sideband is FCC rule, not custom</text>
    <text x="360" y="438" text-anchor="middle" font-size="10" font-style="italic">your SSB dial reads the suppressed-carrier frequency; USB speech energy spreads ~3 kHz above it</text>
  </g>

  <!-- ===== notes ===== -->
  <g fill="currentColor" stroke="none" font-size="10.5" font-style="italic" text-anchor="middle">
    <text x="360" y="468">voluntary, but load-bearing — nobody owns a frequency (47 CFR §97.101(b)), and the zoning keeps neighbors compatible</text>
    <text x="360" y="486">tuning across the NCDXF beacons on five bands is the oldest “is the band open, and to where?” check in HF</text>
  </g>
</svg>
