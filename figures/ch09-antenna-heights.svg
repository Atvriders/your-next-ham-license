<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 465" font-family="sans-serif">

  <!-- ===== Titles ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="380" y="32" font-size="17" font-weight="bold">HEIGHT IN WAVELENGTHS SETS THE PATTERN</text>
    <text x="380" y="53" font-size="12.5">the same horizontal dipole: low it warms the clouds, high it works the world</text>
  </g>

  <!-- ===== Panel headers ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="13.5" font-weight="bold">
    <text x="205" y="86">LOW: 0.1 - 0.25 λ UP</text>
    <text x="555" y="86">HIGH: λ/2 OR MORE UP</text>
  </g>

  <line x1="380" y1="70" x2="380" y2="400" stroke="currentColor" stroke-width="1" stroke-dasharray="2,6" opacity="0.45" fill="none"/>

  <!-- ================= LEFT: low dipole ================= -->
  <g fill="currentColor" stroke="none" font-size="11.5">
    <text x="55" y="112">radiation goes nearly straight up -</text>
    <text x="55" y="126">blankets 0-300 mi, no skip zone</text>
  </g>

  <!-- pattern dome: energy up, nearly omnidirectional at high angles -->
  <path d="M 70,260 A 135,105 0 0 1 340,260 Z" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.8"/>

  <!-- launch rays inside the dome -->
  <g stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round">
    <line x1="205" y1="254" x2="205" y2="172"/>
    <line x1="201" y1="254" x2="165" y2="196"/>
    <line x1="209" y1="254" x2="245" y2="196"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="205,166 199,180 211,180"/>
    <polygon points="162,191 165,206 174,195"/>
    <polygon points="248,191 245,206 236,195"/>
  </g>

  <!-- dipole -->
  <g stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="145" y1="260" x2="200" y2="260"/>
    <line x1="210" y1="260" x2="265" y2="260"/>
  </g>
  <circle cx="200" cy="260" r="2.6" fill="currentColor" stroke="none"/>
  <circle cx="210" cy="260" r="2.6" fill="currentColor" stroke="none"/>

  <!-- height dimension -->
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="205" y1="268" x2="205" y2="314"/>
    <polygon points="205,268 201,277 209,277" fill="currentColor" stroke="none"/>
    <polygon points="205,314 201,305 209,305" fill="currentColor" stroke="none"/>
  </g>
  <text x="215" y="295" font-size="11.5" fill="currentColor" stroke="none">0.1 - 0.25 λ</text>

  <!-- ground -->
  <line x1="50" y1="320" x2="360" y2="320" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.7" fill="none">
    <line x1="70" y1="320" x2="61" y2="331"/>
    <line x1="110" y1="320" x2="101" y2="331"/>
    <line x1="150" y1="320" x2="141" y2="331"/>
    <line x1="190" y1="320" x2="181" y2="331"/>
    <line x1="230" y1="320" x2="221" y2="331"/>
    <line x1="270" y1="320" x2="261" y2="331"/>
    <line x1="310" y1="320" x2="301" y2="331"/>
    <line x1="350" y1="320" x2="341" y2="331"/>
  </g>

  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="11.5">
    <text x="205" y="352">the "cloud-warmer" - feed impedance</text>
    <text x="205" y="368">drops steadily as it gets lower</text>
  </g>

  <!-- ================= RIGHT: high dipole ================= -->
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="11.5">
    <text x="555" y="102">energy heads for the horizon -</text>
    <text x="555" y="116">low takeoff angle, long skip, DX</text>
  </g>

  <!-- pattern: two low-angle lobes -->
  <ellipse cx="466" cy="152" rx="75" ry="20" transform="rotate(18 466 152)" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.8"/>
  <ellipse cx="644" cy="152" rx="75" ry="20" transform="rotate(-18 644 152)" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.8"/>

  <!-- low-angle rays -->
  <g stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round">
    <line x1="551" y1="163" x2="425" y2="137"/>
    <line x1="559" y1="163" x2="685" y2="137"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="419,136 433,131 430,145"/>
    <polygon points="691,136 677,131 680,145"/>
  </g>

  <!-- dipole -->
  <g stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="495" y1="157" x2="550" y2="157"/>
    <line x1="560" y1="157" x2="615" y2="157"/>
  </g>
  <circle cx="550" cy="157" r="2.6" fill="currentColor" stroke="none"/>
  <circle cx="560" cy="157" r="2.6" fill="currentColor" stroke="none"/>

  <!-- height dimension -->
  <g stroke="currentColor" stroke-width="1.2" fill="none">
    <line x1="555" y1="164" x2="555" y2="314"/>
    <polygon points="555,164 551,173 559,173" fill="currentColor" stroke="none"/>
    <polygon points="555,314 551,305 559,305" fill="currentColor" stroke="none"/>
  </g>
  <text x="565" y="238" font-size="11.5" fill="currentColor" stroke="none">λ/2 or more</text>

  <!-- ground -->
  <line x1="400" y1="320" x2="710" y2="320" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.7" fill="none">
    <line x1="420" y1="320" x2="411" y2="331"/>
    <line x1="460" y1="320" x2="451" y2="331"/>
    <line x1="500" y1="320" x2="491" y2="331"/>
    <line x1="540" y1="320" x2="531" y2="331"/>
    <line x1="580" y1="320" x2="571" y2="331"/>
    <line x1="620" y1="320" x2="611" y2="331"/>
    <line x1="660" y1="320" x2="651" y2="331"/>
    <line x1="700" y1="320" x2="691" y2="331"/>
  </g>

  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="11.5">
    <text x="555" y="352">the DX height - impedance back</text>
    <text x="555" y="368">near the free-space ~73 Ω</text>
  </g>

  <!-- ===== Takeaway ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="12">
    <text x="380" y="428">Height is measured in wavelengths, not feet - the same wire is low on 80 m and high on 10 m.</text>
    <text x="380" y="446">Below λ/2 the high-angle pattern goes nearly omnidirectional; higher up, the lobes flatten to the horizon.</text>
  </g>

</svg>
