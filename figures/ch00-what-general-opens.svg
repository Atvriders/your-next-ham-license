<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="sans-serif">

  <!-- ===== title ===== -->
  <text x="400" y="34" font-size="19" font-weight="bold" fill="currentColor" text-anchor="middle">WHAT GENERAL OPENS</text>
  <text x="400" y="55" font-size="11.5" fill="currentColor" text-anchor="middle">Element 3 turns your local VHF/UHF world into a worldwide HF one — phone and data segments light up</text>

  <!-- ===== left panel: Technician today ===== -->
  <rect x="28" y="75" width="300" height="270" rx="10" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.06"/>
  <text x="178" y="103" font-size="10.5" font-weight="bold" fill="currentColor" text-anchor="middle">TODAY</text>
  <text x="178" y="124" font-size="18" font-weight="bold" fill="currentColor" text-anchor="middle">TECHNICIAN</text>

  <!-- tower icon: short arcs = local reach -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="166" y1="200" x2="178" y2="152"/>
    <line x1="190" y1="200" x2="178" y2="152"/>
    <line x1="170" y1="184" x2="186" y2="184"/>
    <line x1="173" y1="172" x2="183" y2="172"/>
    <line x1="178" y1="152" x2="178" y2="144"/>
    <path d="M172.9,131.1 A12,12 0 0 0 167.1,136.9"/>
    <path d="M169.5,123.9 A20,20 0 0 0 159.9,133.6"/>
    <path d="M183.1,131.1 A12,12 0 0 1 188.9,136.9"/>
    <path d="M186.5,123.9 A20,20 0 0 1 196.1,133.6"/>
  </g>
  <circle cx="178" cy="141" r="2.4" fill="currentColor"/>
  <text x="178" y="222" font-size="9.5" fill="currentColor" text-anchor="middle">local &amp; regional — repeaters, simplex, satellites</text>

  <text x="178" y="244" font-size="9.5" font-style="italic" fill="currentColor" text-anchor="middle">your HF foothold:</text>

  <!-- band pills: 80 40 20 15 10 — mostly dim, small lit slivers -->
  <g stroke="currentColor" stroke-width="1.6" fill="currentColor" fill-opacity="0.05">
    <rect x="48" y="252" width="46" height="30" rx="5"/>
    <rect x="102" y="252" width="46" height="30" rx="5"/>
    <rect x="156" y="252" width="46" height="30" rx="5"/>
    <rect x="210" y="252" width="46" height="30" rx="5"/>
    <rect x="264" y="252" width="46" height="30" rx="5"/>
  </g>
  <g fill="currentColor" fill-opacity="0.3" stroke="none">
    <rect x="50" y="254" width="14" height="26" rx="3"/>
    <rect x="104" y="254" width="14" height="26" rx="3"/>
    <rect x="212" y="254" width="14" height="26" rx="3"/>
    <rect x="292" y="254" width="16" height="26" rx="3"/>
  </g>
  <g font-size="10" font-weight="bold" fill="currentColor" text-anchor="middle">
    <text x="71" y="271">80</text>
    <text x="125" y="271">40</text>
    <text x="179" y="271">20</text>
    <text x="233" y="271">15</text>
    <text x="287" y="271">10</text>
  </g>
  <g font-size="7.5" fill="currentColor" text-anchor="middle">
    <text x="71" y="294">CW sliver</text>
    <text x="125" y="294">CW sliver</text>
    <text x="179" y="294">—</text>
    <text x="233" y="294">CW sliver</text>
    <text x="287" y="294">SSB slice</text>
  </g>

  <text x="178" y="316" font-size="9.5" fill="currentColor" text-anchor="middle">CW slivers on 80/40/15 m · one SSB slice of 10 m</text>
  <text x="178" y="332" font-size="9.5" fill="currentColor" text-anchor="middle">200 W PEP cap on those HF slices</text>

  <!-- ===== middle arrow ===== -->
  <text x="396" y="190" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">PASS ELEMENT 3</text>
  <line x1="340" y1="210" x2="452" y2="210" stroke="currentColor" stroke-width="2.5"/>
  <polygon points="460,210 450,205 450,215" fill="currentColor"/>
  <text x="396" y="232" font-size="9" fill="currentColor" text-anchor="middle">35 questions · 26 correct</text>

  <!-- ===== right panel: General after ===== -->
  <rect x="472" y="75" width="300" height="270" rx="10" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity="0.06"/>
  <text x="622" y="103" font-size="10.5" font-weight="bold" fill="currentColor" text-anchor="middle">AFTER ELEMENT 3</text>
  <text x="622" y="124" font-size="18" font-weight="bold" fill="currentColor" text-anchor="middle">GENERAL</text>

  <!-- globe icon: long arcs = worldwide reach -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <circle cx="622" cy="168" r="26"/>
    <ellipse cx="622" cy="168" rx="11" ry="26"/>
    <ellipse cx="622" cy="168" rx="26" ry="9"/>
    <path d="M629,128.6 A40,40 0 0 1 661.4,161"/>
    <path d="M631.4,114.8 A54,54 0 0 1 675.2,158.6"/>
  </g>
  <text x="622" y="222" font-size="9.5" fill="currentColor" text-anchor="middle">worldwide — the ionosphere carries HF</text>

  <text x="622" y="244" font-size="9.5" font-style="italic" fill="currentColor" text-anchor="middle">the same bands, lit up:</text>

  <!-- band pills: lit; thin dim sliver on 80/40/20/15 = Extra-only slice -->
  <g stroke="currentColor" stroke-width="1.6" fill="currentColor" fill-opacity="0.05">
    <rect x="492" y="252" width="46" height="30" rx="5"/>
    <rect x="546" y="252" width="46" height="30" rx="5"/>
    <rect x="600" y="252" width="46" height="30" rx="5"/>
    <rect x="654" y="252" width="46" height="30" rx="5"/>
    <rect x="708" y="252" width="46" height="30" rx="5"/>
  </g>
  <g fill="currentColor" fill-opacity="0.3" stroke="none">
    <rect x="501" y="254" width="35" height="26" rx="3"/>
    <rect x="555" y="254" width="35" height="26" rx="3"/>
    <rect x="609" y="254" width="35" height="26" rx="3"/>
    <rect x="663" y="254" width="35" height="26" rx="3"/>
    <rect x="710" y="254" width="42" height="26" rx="3"/>
  </g>
  <g font-size="10" font-weight="bold" fill="currentColor" text-anchor="middle">
    <text x="515" y="271">80</text>
    <text x="569" y="271">40</text>
    <text x="623" y="271">20</text>
    <text x="677" y="271">15</text>
    <text x="731" y="271">10</text>
  </g>
  <text x="622" y="294" font-size="9" fill="currentColor" text-anchor="middle">phone + data light up on every band</text>

  <text x="622" y="316" font-size="9.5" fill="currentColor" text-anchor="middle">80 → 10 m phone + CW + data · up to 1.5 kW PEP</text>
  <text x="622" y="332" font-size="9.5" fill="currentColor" text-anchor="middle">and you keep every VHF/UHF privilege</text>

  <!-- ===== footnotes ===== -->
  <text x="400" y="374" font-size="10" fill="currentColor" text-anchor="middle">Not quite everything: the lowest slices of 80, 40, 20, and 15 m stay Advanced/Amateur Extra (dimmed above) — that is the next upgrade.</text>
  <text x="400" y="392" font-size="10" fill="currentColor" text-anchor="middle">160, 60, 30, 17, and 12 m open as well — the Chapter 1 band chart maps every segment.</text>

</svg>
