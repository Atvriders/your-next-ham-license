<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== Title ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="400" y="32" font-size="18" font-weight="bold">AN HF STATION, BLOCK BY BLOCK</text>
    <text x="400" y="53" font-size="12">the RF path runs in a straight line — power, audio, and control hook in around it</text>
  </g>

  <!-- ===== Row 1: the RF chain — transceiver, (amp), wattmeter, tuner, feed line, antenna ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5">
    <rect x="30" y="130" width="140" height="85"/>
    <rect x="200" y="130" width="110" height="85" stroke-dasharray="6,4"/>
    <rect x="340" y="130" width="115" height="85"/>
    <rect x="485" y="130" width="110" height="85"/>
  </g>
  <!-- RF interconnects (heavy lines = RF path) -->
  <g stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round">
    <line x1="170" y1="172" x2="190" y2="172"/>
    <line x1="310" y1="172" x2="330" y2="172"/>
    <line x1="455" y1="172" x2="475" y2="172"/>
    <line x1="595" y1="172" x2="672" y2="172"/>
    <!-- antenna whip at the end of the feed line -->
    <line x1="675" y1="172" x2="675" y2="88"/>
    <line x1="663" y1="98" x2="687" y2="98"/>
    <line x1="666" y1="110" x2="684" y2="110"/>
    <line x1="669" y1="122" x2="681" y2="122"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="200,172 190,167 190,177"/>
    <polygon points="340,172 330,167 330,177"/>
    <polygon points="485,172 475,167 475,177"/>
    <polygon points="645,172 635,167 635,177"/>
    <circle cx="675" cy="172" r="3.2"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="100" y="158" font-size="14" font-weight="bold">TRANSCEIVER</text>
    <text x="100" y="174" font-size="10">100 W HF rig</text>
    <text x="100" y="189" font-size="9.5">SSB / CW / data</text>
    <text x="255" y="158" font-size="13" font-weight="bold">LINEAR AMP</text>
    <text x="255" y="174" font-size="9.5">(optional)</text>
    <text x="255" y="189" font-size="9.5">more power out</text>
    <text x="397" y="152" font-size="12" font-weight="bold">DIRECTIONAL</text>
    <text x="397" y="166" font-size="12" font-weight="bold">WATTMETER</text>
    <text x="397" y="182" font-size="9.5">forward +</text>
    <text x="397" y="195" font-size="9.5">reflected → SWR</text>
    <text x="540" y="152" font-size="12" font-weight="bold">ANTENNA</text>
    <text x="540" y="166" font-size="12" font-weight="bold">TUNER</text>
    <text x="540" y="182" font-size="9.5">rig sees its</text>
    <text x="540" y="195" font-size="9.5">design 50 Ω load</text>
    <text x="185" y="163" font-size="9">RF</text>
    <text x="325" y="163" font-size="9">RF</text>
    <text x="470" y="163" font-size="9">RF</text>
    <text x="630" y="161" font-size="10">coax feed line</text>
    <text x="675" y="76" font-size="12" font-weight="bold">ANTENNA</text>
  </g>

  <!-- ALC control return: amplifier back to the rig -->
  <path d="M255,130 L255,105 L100,105 L100,132" stroke="currentColor" fill="none" stroke-width="1.8"/>
  <polygon points="100,134 94,124 106,124" fill="currentColor" stroke="none"/>
  <text x="177" y="97" font-size="9.5" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">ALC limits drive</text>

  <!-- what the tuner does and does not do (G4A06) -->
  <text x="455" y="258" font-size="10" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">the tuner makes the rig see a matched load — SWR on the antenna side is unchanged</text>

  <!-- ===== Row 2: audio, keying, and computer control ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5">
    <rect x="30" y="330" width="140" height="80"/>
    <rect x="220" y="330" width="135" height="80"/>
    <rect x="415" y="330" width="150" height="80"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.8">
    <line x1="355" y1="370" x2="405" y2="370"/>
    <path d="M100,330 L100,227"/>
    <path d="M285,330 L285,305 L140,305 L140,227"/>
    <path d="M490,330 L490,280 L160,280 L160,227"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="415,370 405,365 405,375"/>
    <polygon points="100,219 94,229 106,229"/>
    <polygon points="140,219 134,229 146,229"/>
    <polygon points="160,219 154,229 166,229"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="100" y="362" font-size="12" font-weight="bold">MICROPHONE</text>
    <text x="100" y="376" font-size="12" font-weight="bold">+ PADDLE</text>
    <text x="100" y="393" font-size="9">keyer forms dits + dahs</text>
    <text x="287" y="362" font-size="12.5" font-weight="bold">COMPUTER</text>
    <text x="287" y="379" font-size="9.5">digital modes,</text>
    <text x="287" y="392" font-size="9.5">logging, rig control</text>
    <text x="490" y="358" font-size="12" font-weight="bold">DIGITAL</text>
    <text x="490" y="372" font-size="12" font-weight="bold">INTERFACE</text>
    <text x="490" y="389" font-size="9.5">audio + PTT, isolated</text>
    <text x="490" y="402" font-size="9.5">isolation stops hum</text>
  </g>
  <text x="212" y="297" font-size="9.5" fill="currentColor" stroke="none" text-anchor="middle">CAT control</text>
  <text x="325" y="272" font-size="9.5" fill="currentColor" stroke="none" text-anchor="middle">RX/TX audio + PTT</text>
  <text x="94" y="318" font-size="9.5" fill="currentColor" stroke="none" text-anchor="end">voice + keying</text>

  <!-- ===== Row 3: power ===== -->
  <g stroke="currentColor" fill="none" stroke-width="2.5">
    <rect x="30" y="480" width="120" height="75"/>
    <rect x="200" y="480" width="160" height="75"/>
  </g>
  <line x1="150" y1="517" x2="190" y2="517" stroke="currentColor" stroke-width="1.8"/>
  <polygon points="200,517 190,512 190,522" fill="currentColor" stroke="none"/>
  <path d="M280,480 L280,455 L12,455 L12,172 L20,172" stroke="currentColor" fill="none" stroke-width="1.8"/>
  <polygon points="30,172 20,167 20,177" fill="currentColor" stroke="none"/>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="90" y="512" font-size="12.5" font-weight="bold">120 V AC</text>
    <text x="90" y="530" font-size="9.5">wall outlet</text>
    <text x="280" y="508" font-size="12.5" font-weight="bold">13.8 V DC SUPPLY</text>
    <text x="280" y="526" font-size="9.5">≈ 20 A for a 100 W rig</text>
  </g>
  <text x="146" y="447" font-size="9.5" fill="currentColor" stroke="none" text-anchor="middle">13.8 V DC</text>

  <!-- ===== legend ===== -->
  <g stroke="currentColor" fill="none">
    <line x1="585" y1="485" x2="612" y2="485" stroke-width="3"/>
    <line x1="585" y1="505" x2="612" y2="505" stroke-width="1.8"/>
    <line x1="585" y1="525" x2="612" y2="525" stroke-width="1.8" stroke-dasharray="5,4"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="10">
    <text x="620" y="489">RF path (coax)</text>
    <text x="620" y="509">power · audio · control</text>
    <text x="620" y="529">optional stage</text>
  </g>

  <!-- ===== bottom note ===== -->
  <text x="400" y="612" font-size="11.5" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">RF runs rig → amp → wattmeter → tuner → antenna; power, audio, and control hook in along the way.</text>

</svg>
