<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="sans-serif">

  <!-- ===== Titles ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="380" y="32" font-size="17" font-weight="bold">RF EXPOSURE EVALUATION - THE STATION DUTY</text>
    <text x="380" y="53" font-size="12.5">FCC OET Bulletin 65 is the evaluation guide; the duty never really ends</text>
  </g>

  <!-- ===== Step 0: applicability ===== -->
  <rect x="180" y="74" width="400" height="42" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="380" y="92" font-size="12.5" font-weight="bold">YOUR STATION IS COVERED</text>
    <text x="380" y="107" font-size="11.5">time-averaged transmission over 1 milliwatt → the rules apply</text>
  </g>

  <g stroke="currentColor" stroke-width="1.8" fill="none">
    <line x1="380" y1="116" x2="380" y2="132"/>
  </g>
  <polygon points="380,140 375,129 385,129" fill="currentColor" stroke="none"/>

  <!-- ===== Evaluate header ===== -->
  <rect x="155" y="142" width="450" height="42" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="380" y="160" font-size="12.5" font-weight="bold">EVALUATE - per FCC OET Bulletin 65</text>
    <text x="380" y="175" font-size="11.5">three acceptable ways - any one of them works</text>
  </g>

  <!-- fan-out arrows to the three methods -->
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <line x1="300" y1="184" x2="165" y2="202"/>
    <line x1="380" y1="184" x2="380" y2="202"/>
    <line x1="460" y1="184" x2="595" y2="202"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="162,209 161.5,197 170,204.5"/>
    <polygon points="380,210 375,199 385,199"/>
    <polygon points="598,209 590,204.5 598.5,197"/>
  </g>

  <!-- ===== Three method boxes ===== -->
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="55" y="212" width="210" height="74" rx="8"/>
    <rect x="275" y="212" width="210" height="74" rx="8"/>
    <rect x="495" y="212" width="210" height="74" rx="8"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="160" y="232" font-size="12" font-weight="bold">1. ESTIMATE</text>
    <text x="160" y="250" font-size="11">OET-65 tables and rules</text>
    <text x="160" y="264" font-size="11">of thumb: band, power,</text>
    <text x="160" y="278" font-size="11">antenna, distance</text>

    <text x="380" y="232" font-size="12" font-weight="bold">2. MODEL</text>
    <text x="380" y="250" font-size="11">computer calculation</text>
    <text x="380" y="264" font-size="11">of the power density</text>
    <text x="380" y="278" font-size="11">your antenna makes</text>

    <text x="600" y="232" font-size="12" font-weight="bold">3. MEASURE</text>
    <text x="600" y="250" font-size="11">calibrated field-strength</text>
    <text x="600" y="264" font-size="11">meter + calibrated antenna</text>
    <text x="600" y="278" font-size="11">(an SWR meter won't do)</text>
  </g>

  <!-- converge to the decision -->
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <line x1="160" y1="286" x2="372" y2="314"/>
    <line x1="380" y1="286" x2="380" y2="314"/>
    <line x1="600" y1="286" x2="388" y2="314"/>
  </g>

  <!-- ===== Decision diamond ===== -->
  <polygon points="380,316 545,362 380,408 215,362" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="11.5">
    <text x="380" y="356">could fields in accessible areas</text>
    <text x="380" y="370">exceed the MPE limits?</text>
  </g>

  <!-- yes branch: act -->
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <line x1="545" y1="362" x2="574" y2="362"/>
  </g>
  <polygon points="582,362 571,357 571,367" fill="currentColor" stroke="none"/>
  <text x="559" y="349" font-size="11" fill="currentColor" stroke="none" text-anchor="middle">yes</text>

  <rect x="584" y="320" width="162" height="86" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="10.5">
    <text x="665" y="338" font-size="11.5" font-weight="bold">ACT -</text>
    <text x="665" y="353">cut power,</text>
    <text x="665" y="366">raise the antenna,</text>
    <text x="665" y="379">restrict access, keep the</text>
    <text x="665" y="392">main lobe off people</text>
  </g>

  <!-- no branch: straight down -->
  <g stroke="currentColor" stroke-width="1.8" fill="none">
    <line x1="380" y1="408" x2="380" y2="464"/>
  </g>
  <polygon points="380,472 375,461 385,461" fill="currentColor" stroke="none"/>
  <text x="368" y="422" font-size="11" fill="currentColor" stroke="none" text-anchor="end">no</text>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="392" y="432">within limits - operate,</text>
    <text x="392" y="446">keep people out of hot spots</text>
  </g>

  <!-- act box joins the loop box -->
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <line x1="665" y1="406" x2="665" y2="495"/>
    <line x1="665" y1="495" x2="586" y2="495"/>
  </g>
  <polygon points="578,495 589,490 589,500" fill="currentColor" stroke="none"/>

  <!-- ===== Re-evaluate box ===== -->
  <rect x="180" y="474" width="400" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="380" y="494" font-size="12.5" font-weight="bold">RE-EVALUATE ROUTINELY</text>
    <text x="380" y="510" font-size="11.5">and whenever the station changes - new band, more power,</text>
    <text x="380" y="523" font-size="11.5">new antenna or feed line</text>
  </g>

  <!-- loop-back arrow -->
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <polyline points="180,502 90,502 90,163 149,163"/>
  </g>
  <polygon points="157,163 146,158 146,168" fill="currentColor" stroke="none"/>
  <text x="78" y="335" font-size="11" fill="currentColor" stroke="none" text-anchor="middle" transform="rotate(-90 78 335)">anything changes → evaluate again</text>

  <!-- ===== Footnote ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="12">
    <text x="380" y="566">Estimate first - it costs nothing. If the numbers look close, model it or measure it.</text>
    <text x="380" y="584">Then live with the answer: keep people out of any spot that runs hot.</text>
  </g>

</svg>
