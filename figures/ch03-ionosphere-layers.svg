<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 495" font-family="sans-serif">

  <!-- ===== Panel divider ===== -->
  <line x1="380" y1="55" x2="380" y2="445" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4,5" opacity="0.35"/>

  <!-- ===== DAY header: sun glyph ===== -->
  <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="172" cy="27" r="9"/>
    <line x1="184" y1="27" x2="189" y2="27"/>
    <line x1="172" y1="39" x2="172" y2="44"/>
    <line x1="160" y1="27" x2="155" y2="27"/>
    <line x1="172" y1="15" x2="172" y2="10"/>
    <line x1="180.5" y1="18.5" x2="184" y2="15"/>
    <line x1="163.5" y1="18.5" x2="160" y2="15"/>
    <line x1="163.5" y1="35.5" x2="160" y2="39"/>
    <line x1="180.5" y1="35.5" x2="184" y2="39"/>
  </g>

  <!-- ===== NIGHT header: crescent moon glyph ===== -->
  <path d="M 524,18 C 510,22 510,32 524,36 C 518,32 518,22 524,18 Z" fill="currentColor" stroke="none"/>

  <!-- ===== DAY panel: layer lines (D shown as an absorbing band) ===== -->
  <g fill="none" stroke="currentColor" stroke-width="1.6">
    <line x1="34" y1="100" x2="360" y2="100" stroke-dasharray="8,5"/>
    <line x1="34" y1="155" x2="360" y2="155" stroke-dasharray="8,5"/>
    <line x1="34" y1="215" x2="360" y2="215" stroke-dasharray="8,5"/>
    <line x1="34" y1="268" x2="360" y2="268" stroke-dasharray="8,5"/>
    <line x1="34" y1="292" x2="360" y2="292" stroke-dasharray="8,5"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1" opacity="0.5">
    <line x1="58" y1="270" x2="65" y2="290"/>
    <line x1="82" y1="270" x2="89" y2="290"/>
    <line x1="106" y1="270" x2="113" y2="290"/>
    <line x1="130" y1="270" x2="137" y2="290"/>
    <line x1="154" y1="270" x2="161" y2="290"/>
    <line x1="178" y1="270" x2="185" y2="290"/>
    <line x1="202" y1="270" x2="209" y2="290"/>
    <line x1="226" y1="270" x2="233" y2="290"/>
    <line x1="250" y1="270" x2="257" y2="290"/>
    <line x1="274" y1="270" x2="281" y2="290"/>
    <line x1="298" y1="270" x2="305" y2="290"/>
    <line x1="322" y1="270" x2="329" y2="290"/>
    <line x1="346" y1="270" x2="353" y2="290"/>
  </g>

  <!-- ===== DAY ground with hatching ===== -->
  <line x1="34" y1="425" x2="360" y2="425" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.7" fill="none">
    <line x1="50" y1="425" x2="41" y2="436"/>
    <line x1="80" y1="425" x2="71" y2="436"/>
    <line x1="110" y1="425" x2="101" y2="436"/>
    <line x1="140" y1="425" x2="131" y2="436"/>
    <line x1="170" y1="425" x2="161" y2="436"/>
    <line x1="200" y1="425" x2="191" y2="436"/>
    <line x1="230" y1="425" x2="221" y2="436"/>
    <line x1="260" y1="425" x2="251" y2="436"/>
    <line x1="290" y1="425" x2="281" y2="436"/>
    <line x1="320" y1="425" x2="311" y2="436"/>
    <line x1="350" y1="425" x2="341" y2="436"/>
  </g>

  <!-- ===== DAY TX tower ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="70" y1="425" x2="70" y2="352"/>
    <line x1="70" y1="352" x2="57" y2="339"/>
    <line x1="70" y1="352" x2="70" y2="331"/>
    <line x1="70" y1="352" x2="83" y2="339"/>
  </g>

  <!-- ===== DAY: low-band ray dies in the D region ===== -->
  <path d="M 70,348 L 116,290" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <path d="M 124,286 L 152,278" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3,4"/>
  <path d="M 162,266 L 174,278 M 162,278 L 174,266" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ===== DAY: high-band ray refracted by F2 ===== -->
  <path d="M 70,348 L 225,112 Q 265,94 305,112 L 351,419" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <path d="M 151,224 L 148.5,237.9 L 139.3,231.9 Z" fill="currentColor" stroke="none"/>
  <path d="M 338,300 L 330.6,288 L 341.4,286.4 Z" fill="currentColor" stroke="none"/>
  <circle cx="353" cy="423" r="3.5" fill="currentColor" stroke="none"/>

  <!-- ===== NIGHT panel: layer lines (F merged, E weak, D gone) ===== -->
  <g fill="none" stroke="currentColor" stroke-width="1.6">
    <line x1="400" y1="100" x2="726" y2="100" stroke-dasharray="8,5"/>
    <line x1="400" y1="215" x2="726" y2="215" stroke-dasharray="8,5" opacity="0.4"/>
    <line x1="400" y1="275" x2="726" y2="275" stroke-dasharray="2,5" opacity="0.4"/>
  </g>

  <!-- ===== NIGHT ground with hatching ===== -->
  <line x1="400" y1="425" x2="726" y2="425" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.7" fill="none">
    <line x1="420" y1="425" x2="411" y2="436"/>
    <line x1="450" y1="425" x2="441" y2="436"/>
    <line x1="480" y1="425" x2="471" y2="436"/>
    <line x1="510" y1="425" x2="501" y2="436"/>
    <line x1="540" y1="425" x2="531" y2="436"/>
    <line x1="570" y1="425" x2="561" y2="436"/>
    <line x1="600" y1="425" x2="591" y2="436"/>
    <line x1="630" y1="425" x2="621" y2="436"/>
    <line x1="660" y1="425" x2="651" y2="436"/>
    <line x1="690" y1="425" x2="681" y2="436"/>
    <line x1="720" y1="425" x2="711" y2="436"/>
  </g>

  <!-- ===== NIGHT TX tower ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="430" y1="425" x2="430" y2="352"/>
    <line x1="430" y1="352" x2="417" y2="339"/>
    <line x1="430" y1="352" x2="430" y2="331"/>
    <line x1="430" y1="352" x2="443" y2="339"/>
  </g>

  <!-- ===== NIGHT: low-band ray refracted by F ===== -->
  <path d="M 430,348 L 585,117 Q 625,95 665,117 L 716,419" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <path d="M 511,226 L 508.4,239.9 L 499.2,233.7 Z" fill="currentColor" stroke="none"/>
  <path d="M 700,320 L 692.4,308.1 L 703.2,306.3 Z" fill="currentColor" stroke="none"/>
  <circle cx="718" cy="423" r="3.5" fill="currentColor" stroke="none"/>

  <!-- ===== Labels ===== -->
  <g fill="currentColor" stroke="none">
    <text x="194" y="33" font-size="15" font-weight="bold" letter-spacing="3">DAY</text>
    <text x="540" y="33" font-size="15" font-weight="bold" letter-spacing="3">NIGHT</text>

    <text x="38" y="93" font-size="12.5" font-weight="bold">F2</text>
    <text x="38" y="148" font-size="12.5" font-weight="bold">F1</text>
    <text x="38" y="208" font-size="12.5" font-weight="bold">E</text>
    <text x="40" y="284" font-size="12.5" font-weight="bold">D</text>
    <text x="38" y="113" font-size="10.5">highest region = longest skip</text>

    <text x="46" y="244" font-size="11">80/40 m:</text>
    <text x="46" y="258" font-size="11">absorbed in D</text>
    <text x="137" y="247" font-size="11.5" transform="rotate(-56.9 137 247)">20 m via F2</text>
    <text x="348" y="405" text-anchor="end" font-size="10.5">lands far: long skip</text>
    <text x="64" y="418" text-anchor="end" font-size="11" font-weight="bold">TX</text>

    <text x="404" y="93" font-size="12.5" font-weight="bold">F</text>
    <text x="404" y="116" font-size="10.5">F1 + F2 merge into F</text>
    <text x="404" y="208" font-size="10.5">E (weak)</text>
    <text x="610" y="268" font-size="10.5">D fades away</text>
    <text x="490" y="255" font-size="11.5" transform="rotate(-56.4 490 255)">80 m refracted: DX at night</text>
    <text x="424" y="418" text-anchor="end" font-size="11" font-weight="bold">TX</text>

    <text x="380" y="464" text-anchor="middle" font-size="12">Stack order, lowest to highest: D, E, F1, F2 - F2 is highest, so F2 skip is longest.</text>
    <text x="380" y="483" text-anchor="middle" font-size="12">By day the D region absorbs everything below ~10 MHz (40/60/80/160 m); at night D fades and the low bands open.</text>
  </g>
</svg>
